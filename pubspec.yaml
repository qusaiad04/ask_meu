name: ask_meu
description: ASK MEU - Middle East University Student App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  image_picker: ^1.2.1
  firebase_storage: ^13.3.0
  cloud_firestore: ^6.3.0
  http: ^1.2.0
  google_generative_ai: ^0.4.5
  flutter_dotenv: ^5.1.0
  flutter_markdown: ^0.7.2
  shared_preferences: ^2.2.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/
    - .env
